# Server Configuration
server.port=8080
spring.application.name=ruffcol-backend

# Database Configuration (H2 por defecto para desarrollo sin MySQL)
spring.datasource.url=jdbc:h2:mem:ruffcol_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (opcional, para ver la base de datos en el navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Para usar MySQL en producción, comenta las líneas de H2 arriba y descomenta estas:
# spring.datasource.url=jdbc:mysql://localhost:3306/ruffcol_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=tu_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Initialization (solo data.sql, las tablas se crean con Hibernate)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# CORS Configuration
cors.allowed.origins=http://localhost:8080,http://localhost:3000
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.allow.credentials=true

# JWT Configuration
jwt.secret=ruffcol-secret-key-2024-super-secreto-para-tokens-jwt
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload Configuration
upload.dir=uploads
upload.path=/uploads/

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente - Ruffcol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">🐾 Ruffcol</a>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="login.html">Iniciar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 50px; max-width: 500px;">
        <div class="card">
            <div class="card-header">
                <h1>Registro de Cliente</h1>
            </div>
            
            <div id="error-container" class="alert alert-danger" style="display: none;"></div>
            <div id="success-container" class="alert alert-success" style="display: none;"></div>
            
            <form id="registro-form">
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña (mínimo 6 caracteres):</label>
                    <input type="password" id="password" class="form-control" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña:</label>
                    <input type="password" id="confirm-password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarse como Cliente</button>
            </form>
            
            <p style="margin-top: 20px; text-align: center;">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('registro-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorContainer = document.getElementById('error-container');
            const successContainer = document.getElementById('success-container');
            
            errorContainer.style.display = 'none';
            successContainer.style.display = 'none';
            
            if (password !== confirmPassword) {
                errorContainer.textContent = 'Las contraseñas no coinciden';
                errorContainer.style.display = 'block';
                return;
            }
            
            try {
                const usuario = await registerCliente(nombre, email, password);
                successContainer.textContent = '¡Registro exitoso! Ahora puedes iniciar sesión.';
                successContainer.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                errorContainer.textContent = 'Error al registrarse: ' + error.message;
                errorContainer.style.display = 'block';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Ruffcol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">🐾 Ruffcol</a>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li id="auth-links">
                        <a href="login.html">Iniciar Sesión</a>
                    </li>
                    <li id="user-links" style="display: none;">
                        <span id="user-name"></span>
                        <a href="#" onclick="logout()">Cerrar Sesión</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">
        <div class="card">
            <div class="card-header">
                <h1>Carrito de Compras</h1>
            </div>
            
            <div id="error-container" class="alert alert-danger" style="display: none;"></div>
            <div id="success-container" class="alert alert-success" style="display: none;"></div>
            
            <div id="carrito-vacio" style="text-align: center; padding: 40px; display: none;">
                <p style="font-size: 1.2rem; color: #666;">Tu carrito está vacío</p>
                <a href="index.html" class="btn btn-primary" style="margin-top: 20px;">Ir al Catálogo</a>
            </div>
            
            <div id="carrito-items"></div>
            
            <div id="carrito-total" class="cart-total" style="display: none;">
                Total: $<span id="total-amount">0.00</span>
            </div>
            
            <div id="carrito-acciones" style="margin-top: 20px; text-align: right; display: none;">
                <button class="btn btn-secondary" onclick="vaciarCarrito()">Vaciar Carrito</button>
                <button class="btn btn-success" onclick="realizarPedido()">Realizar Pedido</button>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Verificar autenticación al cargar el carrito
            if (!isAuthenticated()) {
                alert('Debes iniciar sesión para ver tu carrito');
                localStorage.setItem('redirectAfterLogin', 'carrito.html');
                window.location.href = 'login.html';
                return;
            }
            
            if (isAuthenticated()) {
                document.getElementById('auth-links').style.display = 'none';
                document.getElementById('user-links').style.display = 'flex';
                document.getElementById('user-name').textContent = `Hola, ${localStorage.getItem('userName')}`;
            }
            
            cargarCarrito();
        });

        function cargarCarrito() {
            const carrito = getCarrito();
            const container = document.getElementById('carrito-items');
            const vacioContainer = document.getElementById('carrito-vacio');
            const totalContainer = document.getElementById('carrito-total');
            const accionesContainer = document.getElementById('carrito-acciones');
            
            if (carrito.length === 0) {
                container.innerHTML = '';
                vacioContainer.style.display = 'block';
                totalContainer.style.display = 'none';
                accionesContainer.style.display = 'none';
                return;
            }
            
            vacioContainer.style.display = 'none';
            totalContainer.style.display = 'block';
            accionesContainer.style.display = 'block';
            
            container.innerHTML = '';
            
            carrito.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.nombre}</div>
                        <div class="cart-item-price">$${item.precio.toFixed(2)}</div>
                    </div>
                    <div class="cart-item-quantity">
                        <button class="btn btn-secondary" onclick="cambiarCantidad(${item.productoId}, -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button class="btn btn-secondary" onclick="cambiarCantidad(${item.productoId}, 1)">+</button>
                        <button class="btn btn-danger" onclick="eliminarItem(${item.productoId})">Eliminar</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
            
            const total = calcularTotalCarrito();
            document.getElementById('total-amount').textContent = total.toFixed(2);
        }

        function cambiarCantidad(productoId, cambio) {
            const carrito = getCarrito();
            const item = carrito.find(i => i.productoId === productoId);
            
            if (item) {
                const nuevaCantidad = item.cantidad + cambio;
                actualizarCantidadCarrito(productoId, nuevaCantidad);
                cargarCarrito();
            }
        }

        function eliminarItem(productoId) {
            eliminarDelCarrito(productoId);
            cargarCarrito();
        }

        function vaciarCarrito() {
            if (confirm('¿Estás seguro de que quieres vaciar el carrito?')) {
                vaciarCarrito();
                cargarCarrito();
            }
        }

        async function realizarPedido() {
            if (!isAuthenticated()) {
                alert('Debes iniciar sesión para realizar un pedido');
                window.location.href = 'login.html';
                return;
            }
            
            const carrito = getCarrito();
            if (carrito.length === 0) {
                alert('El carrito está vacío');
                return;
            }
            
            const errorContainer = document.getElementById('error-container');
            const successContainer = document.getElementById('success-container');
            
            errorContainer.style.display = 'none';
            successContainer.style.display = 'none';
            
            try {
                const items = carrito.map(item => ({
                    productoId: item.productoId,
                    cantidad: item.cantidad
                }));
                
                await createPedido(items);
                
                successContainer.textContent = '¡Pedido realizado exitosamente!';
                successContainer.style.display = 'block';
                
                vaciarCarrito();
                cargarCarrito();
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } catch (error) {
                errorContainer.textContent = 'Error al realizar el pedido: ' + error.message;
                errorContainer.style.display = 'block';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ruffcol</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b00 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .card-header {
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b00 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-img {
            height: 60px;
            width: auto;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b00 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #e67d00 0%, #e05e00 100%);
        }
        .input-group-text {
            background-color: #808080;
            color: white;
            border: 1px solid #808080;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card login-card">
                    <div class="card-header text-center">
                        <div class="logo-container">
                            <img src="images/logo.jpg" alt="Ruffcol Logo" class="logo-img" onerror="this.style.display='none'">
                            <h4 class="mb-0 mt-2">Ruffcol</h4>
                        </div>
                        <p class="mb-0">Iniciar Sesión</p>
                    </div>
                    <div class="card-body p-4">
                        <div id="error-container" class="alert alert-danger" style="display: none;"></div>
                        <div id="success-container" class="alert alert-success" style="display: none;"></div>

                        <form id="login-form">
                            <div class="mb-3">
                                <label for="username" class="form-label">Nombre de usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" required placeholder="Ingresa tu usuario">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" required placeholder="Ingresa tu contraseña">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                        </form>

                        <div class="text-center mt-3">
                            <p class="mb-0">¿No tienes cuenta? <a href="registro.html" class="text-decoration-none">Regístrate aquí</a></p>
                        </div>

                        <div class="text-center mt-3">
                            <a href="index.html" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-house"></i> Volver al Inicio
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Request.js -->
    <script src="js/request.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorContainer = document.getElementById('error-container');
            const successContainer = document.getElementById('success-container');

            errorContainer.style.display = 'none';
            successContainer.style.display = 'none';

            const data = {
                username: username,
                password: password
            };

            post('/api/auth/login', data)
                .then(function(response) {
                    // Guardar token y datos del usuario
                    setToken(response.token);
                    saveUserData(response);

                    successContainer.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
                    successContainer.style.display = 'block';

                    setTimeout(function() {
                        // Redirigir según el rol
                        const redirectUrl = localStorage.getItem('redirectAfterLogin') || 'index.html';
                        localStorage.removeItem('redirectAfterLogin');
                        window.location.href = redirectUrl;
                    }, 1500);
                })
                .catch(function(error) {
                    errorContainer.textContent = 'Error al iniciar sesión: ' + error.message;
                    errorContainer.style.display = 'block';
                });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ruffcol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">🐾 Ruffcol</a>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="registro.html">Registrarse</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 50px; max-width: 500px;">
        <div class="card">
            <div class="card-header">
                <h1>Iniciar Sesión</h1>
            </div>
            
            <div id="error-container" class="alert alert-danger" style="display: none;"></div>
            <div id="success-container" class="alert alert-success" style="display: none;"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Iniciar Sesión</button>
            </form>
            
            <p style="margin-top: 20px; text-align: center;">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorContainer = document.getElementById('error-container');
            const successContainer = document.getElementById('success-container');
            
            errorContainer.style.display = 'none';
            successContainer.style.display = 'none';
            
            try {
                const response = await login(email, password);
                successContainer.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
                successContainer.style.display = 'block';
                
                setTimeout(() => {
                    redirectAfterLogin();
                }, 1500);
            } catch (error) {
                errorContainer.textContent = 'Error al iniciar sesión: ' + error.message;
                errorContainer.style.display = 'block';
            }
        });
    </script>
</body>
</html>
